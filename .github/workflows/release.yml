# Builds SecHUD and runs its tests on every push, on a clean Windows machine.
#
# Publishing a release is a separate, deliberate step. Either:
#   - open the Actions tab on GitHub, pick "Build and release", press Run workflow, or
#   - push a tag named after the version, for example v0.8.0
# The release is named after <Version> in SecHUD.csproj and its text comes from CHANGELOG.md.
# Everyone running an older copy then sees UPDATE AVAILABLE within a day.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version as a release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content SecHUD.csproj
          $version = $project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'No <Version> found in SecHUD.csproj.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "SecHUD $version"

      - name: Build the app
        run: dotnet build SecHUD.csproj -c Release -nologo

      - name: Build and run the tests
        shell: pwsh
        run: |
          dotnet build tests\SecHUD.Tests.csproj -c Release -nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & tests\bin\Release\SecHUD.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'A test failed.' }

      - name: Build the installer
        run: dotnet build setup\SecHUD.Setup.csproj -c Release -nologo

      # A real install and uninstall on this machine, using the newest published release.
      - name: Try the installer
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'setup\bin\Release\SecHUD-Setup.exe').Path
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\SecHUD'
          $log = Join-Path $env:LOCALAPPDATA 'SecHUD\error.log'
          $startMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'SecHUD.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'SecHUD.lnk'
          $regKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SecHUD'

          # The window opens and stays open (a mistake in its layout would close it at once).
          foreach ($mode in @(@(), @('--uninstall'))) {
            $window = if ($mode.Count) { Start-Process $setup -ArgumentList $mode -PassThru } else { Start-Process $setup -PassThru }
            Start-Sleep -Seconds 6
            if ($window.HasExited) { throw "The setup window closed by itself (mode: $mode)." }
            $window.Refresh()
            Write-Host "Window open: '$($window.MainWindowTitle)'"
            $window | Stop-Process -Force
          }

          $install = Start-Process $setup -ArgumentList '--silent', '--no-launch' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            $why = if (Test-Path $log) { Get-Content $log -Raw } else { 'no log was written' }
            if ($why -match 'GitHub answered (403|429)') {
              # GitHub limits anonymous requests from shared build machines. Not a fault in the installer.
              Write-Host "::warning::Installer check skipped: GitHub rate-limited this build machine."
              exit 0
            }
            Write-Host $why
            throw 'The silent install failed.'
          }
          foreach ($path in @("$dir\SecHUD.exe", "$dir\Uninstall.exe", $startMenu, $desktop)) {
            if (-not (Test-Path $path)) { throw "Missing after install: $path" }
          }
          $entry = Get-ItemProperty $regKey
          $installed = (Get-Item "$dir\SecHUD.exe").VersionInfo.FileVersion
          Write-Host "Installed SecHUD $installed to $dir (registered as $($entry.DisplayName) $($entry.DisplayVersion))"
          if ($entry.InstallLocation -ne $dir) { throw 'The Installed apps entry points at the wrong folder.' }

          # Uninstall.exe steps out to the temp folder first, so wait for the folder to go.
          Start-Process "$dir\Uninstall.exe" -ArgumentList '--uninstall', '--silent' -Wait | Out-Null
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          foreach ($path in @($dir, $startMenu, $desktop, $regKey)) {
            if (Test-Path $path) { throw "Still there after uninstall: $path" }
          }
          Write-Host 'Install and uninstall both worked.'

      - name: Pack the zip
        id: pack
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $stage = "release\SecHUD-v$version"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item bin\Release\SecHUD.exe $stage
          if (Test-Path bin\Release\SecHUD.exe.config) { Copy-Item bin\Release\SecHUD.exe.config $stage }
          Copy-Item README.md, LICENSE $stage
          $zip = "release\SecHUD-v$version.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  SecHUD-v$version.zip" | Set-Content "release\SecHUD-v$version.sha256.txt"
          Write-Host "SHA-256: $hash"

          # The release text is this version's section of CHANGELOG.md.
          $notes = New-Object System.Collections.Generic.List[string]
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^##\s') {
              if ($inside) { break }
              $inside = $line -match ('^##\s+v?' + [regex]::Escape($version) + '(\s|$)')
              continue
            }
            if ($inside) { $notes.Add($line) }
          }
          $text = ($notes -join "`n").Trim()
          if (-not $text) { $text = "SecHUD $version" }
          $text + "`n`nSHA-256 of the zip: ``$hash``" | Set-Content release\notes.md

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: SecHUD-v${{ steps.version.outputs.version }}
          path: |
            release/*.zip
            release/*.sha256.txt
            setup/bin/Release/SecHUD-Setup.exe
          retention-days: 14

      - name: Publish the release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "The tag ${{ github.ref_name }} does not match version $version in SecHUD.csproj."
          }
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists. Raise <Version> in SecHUD.csproj first." }
          gh release create "v$version" "setup\bin\Release\SecHUD-Setup.exe" "release\SecHUD-v$version.zip" "release\SecHUD-v$version.sha256.txt" `
            --title "SecHUD $version" --notes-file release\notes.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'The release could not be created.' }
